<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive HLS test</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; }
  video-player, video-skin, hlsjs-video { display: block; width: 100%; }
</style>
<script type="importmap">
  { "imports": {
    "@videojs/html/": "https://esm.sh/@videojs/html@10.2.0/",
    "@videojs/hlsjs-video": "https://esm.sh/@videojs/hlsjs-video@10.2.0"
  } }
</script>
<script type="module">
  import '@videojs/html/video/player';
  import '@videojs/html/video/skin';
  import '@videojs/html/media/hlsjs-video';

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('hlsjs-video').source = {
      src: new URL('master.m3u8', location.href).href,
      capRenditionToPlayerSize: false,
    };
  });
</script>
<h1>Adaptive HLS test</h1>
<video-player>
  <video-skin>
    <hlsjs-video crossorigin="anonymous" muted playsinline></hlsjs-video>
  </video-skin>
</video-player>
